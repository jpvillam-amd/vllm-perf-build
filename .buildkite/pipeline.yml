# Build a vLLM ROCm docker image from any vLLM PR, branch, or commit.
#
# Trigger with environment variables (Buildkite UI "New Build" -> Environment
# Variables, or via the REST API / a trigger step). Exactly one of:
#
#   VLLM_PR=12345                # builds refs/pull/12345/head on vllm-project/vllm
#   VLLM_BRANCH=my-feature       # builds that branch
#   VLLM_COMMIT=<full-sha>       # builds that exact commit
#
# Optional overrides are listed in the env block below.

# Also set explicitly on every step below. The top-level block alone did not
# propagate to uploaded steps on this agent version — they came through with no
# agent query rules and sat unscheduled on the default queue.
agents:
  queue: amd-cpu

env:
  DOCKERHUB_USER: "${DOCKERHUB_USER:-jpvillam}"

steps:
  - label: ":mag: Resolve vLLM ref"
    key: "resolve"
    command: ".buildkite/scripts/resolve_ref.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10

  - label: ":docker: Build & push ROCm image"
    key: "build"
    depends_on: "resolve"
    command: ".buildkite/scripts/build_and_push.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 300
    # A HIP kernel build is long and occasionally hits transient network
    # failures pulling the base image or cloning vLLM. Retry the whole step
    # rather than leaving a half-built image behind.
    retry:
      automatic:
        - exit_status: -1  # agent lost
          limit: 2
        - exit_status: 255 # agent forced shutdown
          limit: 2

  - label: ":chart_with_upwards_trend: Trigger perf-eval"
    key: "perf-eval"
    depends_on: "build"
    command: ".buildkite/scripts/trigger_perf_eval.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10
