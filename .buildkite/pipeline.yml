# Build a vLLM ROCm docker image from any vLLM PR, branch, or commit.
#
# Trigger with environment variables (Buildkite UI "New Build" -> Environment
# Variables, or via the REST API / a trigger step). Exactly one of:
#
#   VLLM_PR=12345                # builds refs/pull/12345/head on vllm-project/vllm
#   VLLM_BRANCH=my-feature       # builds that branch
#   VLLM_COMMIT=<full-sha>       # builds that exact commit
#
# Optional overrides are listed in the env block below.

# Also set explicitly on every step below. The top-level block alone did not
# propagate to uploaded steps on this agent version — they came through with no
# agent query rules and sat unscheduled on the default queue.
agents:
  queue: amd-cpu

env:
  # --- what to build -------------------------------------------------------
  VLLM_REPO: "https://github.com/vllm-project/vllm.git"

  # --- how to build it -----------------------------------------------------
  # Prebuilt ROCm base image. Pulled, not built, so the expensive ROCm/PyTorch
  # layers are never compiled on this agent.
  BASE_IMAGE: "rocm/vllm-dev:base"
  # Dockerfile stage to produce. "vllm-openai" is the OpenAI-compatible serving
  # image; "final" is the same runtime without the entrypoint.
  DOCKER_TARGET: "vllm-openai"
  # Semicolon-separated GPU targets. Each additional arch adds a full HIP
  # kernel compile pass, so keep this as narrow as the consumers allow.
  PYTORCH_ROCM_ARCH: "gfx942;gfx950"

  # --- where it goes -------------------------------------------------------
  IMAGE_REPO: "rocm/vllm-dev"
  DOCKERHUB_USER: "jpvillam"
  # Name of the Buildkite secret holding the Docker Hub access token.
  DOCKERHUB_TOKEN_SECRET: "dockerhub_token"
  PUSH_IMAGE: "true"

  # --- downstream perf-eval ------------------------------------------------
  # Off by default; set TRIGGER_PERF_EVAL=true on a build to run perf-eval
  # against the image this pipeline just pushed.
  TRIGGER_PERF_EVAL: "false"
  PERF_EVAL_PIPELINE: "perf-eval"
  # Comma- or space-separated, e.g. "llama3-8b-throughput,mixtral-latency".
  PERF_EVAL_WORKLOADS: ""
  # "true" -> one downstream build per workload, "false" -> one build with all.
  PERF_EVAL_FANOUT: "false"
  # "true" -> don't block this build on perf-eval finishing.
  PERF_EVAL_ASYNC: "true"

steps:
  - label: ":mag: Resolve vLLM ref"
    key: "resolve"
    command: ".buildkite/scripts/resolve_ref.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10

  - label: ":docker: Build & push ROCm image"
    key: "build"
    depends_on: "resolve"
    command: ".buildkite/scripts/build_and_push.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 300
    # A HIP kernel build is long and occasionally hits transient network
    # failures pulling the base image or cloning vLLM. Retry the whole step
    # rather than leaving a half-built image behind.
    retry:
      automatic:
        - exit_status: -1  # agent lost
          limit: 2
        - exit_status: 255 # agent forced shutdown
          limit: 2

  - label: ":chart_with_upwards_trend: Trigger perf-eval"
    key: "perf-eval"
    depends_on: "build"
    command: ".buildkite/scripts/trigger_perf_eval.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10
