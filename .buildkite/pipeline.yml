# Build vLLM ROCm docker images. This file only picks the flow; the steps live
# in one pipeline file per flow, chosen by FLOW on the build:
#
#   FLOW unset          pipeline.source.yml        build vLLM from source
#   FLOW=aiter-nightly  pipeline.aiter-nightly.yml AITER nightly overlay
#
# Any other FLOW value fails. See README.md for each flow's variables.

steps:
  - label: ":pipeline: Select flow"
    command: ".buildkite/scripts/select_flow.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10
